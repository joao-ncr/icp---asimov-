# Taxonomia de sinais. Padroes aplicados a texto SEM acentos e em minusculas.
# kind: need (indica oportunidade) | solution_present (reduz a lacuna para o servico) | context
# source: text (frase do site, evidencia = trecho literal) | technical (checagem deterministica de HTML)
signals:
  - {code: OPERATIONAL_FIELD, category: OPERATIONAL_SIGNAL, kind: need, source: text, strength: 0.8, observability: media,
     description: "Operacao de campo / equipes externas / inspecoes / visitas.",
     interpretation: "Pode haver coleta de dados em campo e necessidade de mobilidade e centralizacao.",
     services: {aplicativo: 0.8, software: 0.5, dados: 0.3},
     patterns: ['equipes? (de campo|externas?)', 'atendimento em campo', 'visitas? tecnicas?', 'inspec(ao|oes)', 'vistorias?', 'tecnicos? em campo', 'servicos? em campo', 'manutenc(ao|oes) (preventivas?|corretivas?|industriais?)']}
  - {code: OPERATIONAL_MULTI_UNIT, category: OPERATIONAL_SIGNAL, kind: need, source: text, strength: 0.6, observability: alta, min_number: 2,
     description: "Varias unidades/filiais/lojas declaradas.",
     interpretation: "Pode indicar complexidade operacional e necessidade de acompanhamento centralizado.",
     services: {software: 0.6, dados: 0.6},
     patterns: ['(\d{1,3}) (unidades|filiais|lojas|escritorios|franquias|polos|clinicas|agencias)', 'diversas unidades', 'todo o brasil']}
  - {code: OPERATIONAL_LOGISTICS, category: OPERATIONAL_SIGNAL, kind: need, source: text, strength: 0.5, observability: media,
     description: "Logistica, frota, entregas, rastreamento.",
     interpretation: "Operacao logistica costuma gerar dados e demandar controle.",
     services: {software: 0.5, dados: 0.5, aplicativo: 0.3},
     patterns: ['logistica', 'frota', 'rastreamento', 'entregas?', 'transportadora', 'distribuidora']}
  - {code: OPERATIONAL_INVENTORY, category: OPERATIONAL_SIGNAL, kind: need, source: text, strength: 0.6, observability: media,
     description: "Estoque, almoxarifado, grande catalogo.",
     interpretation: "Controle de estoque pode depender de planilhas ou sistemas desconectados.",
     services: {software: 0.7, dados: 0.4},
     patterns: ['estoques?', 'almoxarifado', 'armazem', 'armazenagem', 'mais de \d+ produtos', 'catalogo com \d+']}
  - {code: MANAGEMENT_CONTRACTS, category: MANAGEMENT_SIGNAL, kind: need, source: text, strength: 0.6, observability: media,
     description: "Contratos, carteira de clientes, associados, mensalistas.",
     interpretation: "Gestao de muitos clientes/contratos pode se beneficiar de centralizacao.",
     services: {software: 0.7, dados: 0.3},
     patterns: ['gestao de contratos', 'contratos recorrentes', 'carteira de clientes', 'associados', 'mensalistas', 'assinaturas', 'locacao de', 'administracao de (imoveis|condominios)']}
  - {code: MANAGEMENT_SCHEDULING, category: MANAGEMENT_SIGNAL, kind: need, source: text, strength: 0.5, observability: alta,
     description: "Agendamento, reservas, ordens de servico.",
     interpretation: "Agendamento/ordens de servico podem ser feitos manualmente (WhatsApp/telefone).",
     services: {software: 0.5, aplicativo: 0.5, site: 0.3},
     patterns: ['agendamentos?', 'agende (sua|seu|um)', 'reservas?', 'ordens? de servico']}
  - {code: DATA_REPORTING, category: DATA_SIGNAL, kind: need, source: text, strength: 0.6, observability: media,
     description: "Relatorios, laudos, indicadores, monitoramento.",
     interpretation: "Relatorios recorrentes podem ser montados manualmente; indicadores sugerem uso de dados.",
     services: {dados: 0.8, software: 0.4},
     patterns: ['relatorios?', 'laudos?', 'indicadores', 'kpis?', 'monitoramento', 'acompanhamento de resultados', 'metricas']}
  - {code: DATA_VOLUME, category: DATA_SIGNAL, kind: need, source: text, strength: 0.5, observability: baixa,
     description: "Grande volume de dados ou historico.",
     interpretation: "Volume de dados pode permitir analise e previsao.",
     services: {dados: 0.8},
     patterns: ['milhoes de', 'milhares de (clientes|pedidos|registros|atendimentos|medicoes)', 'base de dados', 'historico de']}
  - {code: AUTOMATION_MANUAL, category: AUTOMATION_SIGNAL, kind: need, source: text, strength: 0.7, observability: baixa,
     description: "Mencao a planilhas, papel, processo manual, WhatsApp operacional.",
     interpretation: "Processo possivelmente manual/fragmentado; digitalizacao pode reduzir retrabalho.",
     services: {software: 0.8, aplicativo: 0.4, dados: 0.4, automacao: 0.5},
     patterns: ['planilhas?', 'processos? manuais?', 'controle manual', 'em papel', 'fichas? de papel', 'pelo whatsapp', 'via whatsapp']}
  - {code: MOBILE_CUSTOMER, category: MOBILE_SIGNAL, kind: need, source: text, strength: 0.4, observability: baixa,
     description: "Relacionamento recorrente com usuarios (pedidos, acompanhamento, pacientes, alunos).",
     interpretation: "Pode haver espaco para canal mobile com o cliente.",
     services: {aplicativo: 0.6, software: 0.2},
     patterns: ['acompanhe (seu|seus|sua|suas)', 'pedidos online', 'delivery', 'alunos', 'pacientes', 'clientes recorrentes']}
  # --- Criterios v2 (portfolio ampliado: automacao, engenharia de dados, LLM em engenharia, colaboracao entre areas) ---
  # concreteness: concrete = a pagina descreve uma DOR/necessidade; contextual = apenas descreve a atividade (compatibilidade
  # superficial: sozinha nao sustenta fit alto, ver evidence.contextual_fit_cap). collaboration: peso do sinal na dimensao propria.
  - {code: DATA_MANUAL_TRANSFER, category: DATA_SIGNAL, kind: need, source: text, strength: 0.75, observability: baixa, concreteness: concrete,
     description: "Transferencia/consolidacao manual de dados entre planilhas e sistemas.",
     interpretation: "Dados movidos ou conferidos manualmente entre ferramentas: candidato a integracao e automacao de fluxo de dados.",
     services: {dados: 0.8, automacao: 0.7, software: 0.3},
     patterns: ['digitac(ao|oes) manua(l|is)', 'lancamentos? manua(l|is)', 'transferencia manual', 'copiar e colar', 'conferencia manual', 'consolidac(ao|oes) (de|dos) (dados|planilhas|relatorios)', 'dados? (em|de) planilhas? (para|no) sistema']}
  - {code: DATA_SYSTEMS_FRAGMENTED, category: DATA_SIGNAL, kind: need, source: text, strength: 0.7, observability: baixa, concreteness: concrete, collaboration: 0.5,
     description: "Dados espalhados em sistemas/ferramentas que nao se comunicam.",
     interpretation: "Informacao fragmentada entre sistemas: necessidade de integracao e estruturacao de bases.",
     services: {dados: 0.8, software: 0.5, automacao: 0.5},
     patterns: ['integrac(ao|oes) (entre|de) (sistemas|plataformas|ferramentas)', 'sistemas? (diferentes|distintos|separados|desconectados|isolados)', 'dados (espalhados|dispersos|descentralizados|fragmentados)', 'informac(ao|oes) (espalhadas?|dispersas?|descentralizadas?)', 'sistemas? que nao (se )?(comunicam|conversam|integram)']}
  - {code: AUTOMATION_REPETITIVE, category: AUTOMATION_SIGNAL, kind: need, source: text, strength: 0.7, observability: baixa, concreteness: concrete,
     description: "Tarefas repetitivas, retrabalho ou rotinas manuais recorrentes.",
     interpretation: "Rotina repetitiva/retrabalho sugere processo automatizavel.",
     services: {automacao: 0.8, software: 0.5, dados: 0.3},
     patterns: ['tarefas? repetitivas?', 'retrabalho', 'rotinas? (manuais?|repetitivas?)', 'emissao manual', 'aprovac(ao|oes) (manua(l|is)|por e-?mail)', 'automatizar (processos|rotinas|tarefas)']}
  - {code: ENGINEERING_TECHNICAL_DOCS, category: AUTOMATION_SIGNAL, kind: need, source: text, strength: 0.5, observability: media, concreteness: contextual,
     description: "Producao recorrente de documentos tecnicos de engenharia (laudos, memoriais, projetos, orcamentos de obra).",
     interpretation: "Atividade documental tecnica recorrente: possivel espaco para LLM/automacao de engenharia (a confirmar se ha dor).",
     services: {automacao: 0.7, dados: 0.3},
     patterns: ['memorial descritivo', 'laudos? tecnicos?', 'projetos? (eletricos?|estruturais?|hidraulicos?|executivos?)', 'orcamentos? de obras?', 'especificac(ao|oes) tecnicas?', 'normas? tecnicas?', 'pareceres? tecnicos?', 'estudos? de viabilidade']}
  - {code: MOBILE_FIELD_FORMS, category: MOBILE_SIGNAL, kind: need, source: text, strength: 0.65, observability: baixa, concreteness: concrete,
     description: "Checklists, apontamentos ou formularios de campo registrados em papel/planilha.",
     interpretation: "Registro de campo possivelmente manual: candidato a aplicativo com coleta e sincronizacao.",
     services: {aplicativo: 0.8, dados: 0.4, automacao: 0.3},
     patterns: ['checklists? (em papel|manua(l|is)|impressos?)', 'apontamentos? (de campo|manua(l|is)|em papel)', 'formularios? (de campo|em papel|impressos?)', 'relatorios? de campo', 'registro (em papel|manual) (no|em) campo']}
  - {code: SOFTWARE_CUSTOM_NEED, category: MANAGEMENT_SIGNAL, kind: need, source: text, strength: 0.75, observability: baixa, concreteness: concrete,
     description: "Declara necessidade de sistema sob medida ou controles improvisados.",
     interpretation: "Controles improvisados ou busca explicita por sistema proprio: necessidade de software personalizado.",
     services: {software: 0.85, automacao: 0.3, dados: 0.3},
     patterns: ['sistema sob medida', 'sistema personalizado', 'controle (feito )?em (excel|planilhas?)', 'nao (temos|possuimos) (um )?sistema', 'precisamos de (um )?(sistema|aplicativo|software)', 'sistema (atual )?nao atende']}
  - {code: COLLABORATION_CROSS_AREA, category: COLLABORATION_SIGNAL, kind: need, source: text, strength: 0.6, observability: baixa, concreteness: concrete, collaboration: 0.8,
     description: "Processo que depende de varias areas/equipes/especialidades trabalhando de forma integrada.",
     interpretation: "Problema que atravessa areas: a solucao tende a exigir mais de uma especialidade (software, mobile, dados).",
     services: {},
     patterns: ['multidisciplinar(es)?', 'integrac(ao|oes) entre (areas|setores|departamentos|equipes)', 'comunicacao entre (areas|setores|departamentos|equipes)', '(varias|diversas|diferentes) areas (da empresa|envolvidas)', 'setores? (nao )?(se )?(comunicam|conversam)']}
  - {code: GROWTH_SIGNAL, category: GROWTH_SIGNAL, kind: context, source: text, strength: 0.3, observability: media,
     description: "Vagas, expansao, nova unidade.",
     interpretation: "Crescimento pode indicar capacidade de investir (contexto, nao dor).",
     services: {},
     patterns: ['trabalhe conosco', 'estamos contratando', 'expansao', 'nova unidade']}
  - {code: TECH_HAS_APP, category: TECHNOLOGY_SIGNAL, kind: solution_present, source: text, strength: 0.7, observability: alta,
     description: "Ja possui aplicativo.", interpretation: "Reduz a lacuna para aplicativo.",
     reduces: {aplicativo: 0.7}, services: {},
     patterns: ['baixe (o|nosso) (app|aplicativo)', 'google play', 'app store', 'nosso aplicativo', 'disponivel (no|na) (google play|app store)']}
  - {code: TECH_HAS_PORTAL, category: TECHNOLOGY_SIGNAL, kind: solution_present, source: text, strength: 0.6, observability: alta,
     description: "Ja possui portal/area do cliente.", interpretation: "Reduz a lacuna para software/app de relacionamento.",
     reduces: {software: 0.4, aplicativo: 0.4}, services: {},
     patterns: ['area do cliente', 'portal do cliente', 'portal de (clientes|servicos)', 'acesse sua conta']}
  - {code: TECH_HAS_ERP, category: TECHNOLOGY_SIGNAL, kind: solution_present, source: text, strength: 0.6, observability: media,
     description: "Menciona ERP/CRM/sistema proprio.", interpretation: "Possivel sistema ja existente; lacuna menor para software de gestao.",
     reduces: {software: 0.6}, services: {},
     patterns: ['erp', 'crm', 'sistema proprio', 'software de gestao', 'plataforma propria', 'totvs', 'sap']}
  # Sinais tecnicos (checagem deterministica do HTML; tipo absence_inference)
